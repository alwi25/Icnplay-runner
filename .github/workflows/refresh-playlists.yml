name: refresh-playlists

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "icn_runner.py"
      - "config.json"
      - "health_check.py"
      - "merge_build.py"
      - "maxstream_build.py"
  schedule:
    # Every 6 hours. GitHub may delay scheduled runs under platform load.
    - cron: "20 */6 * * *"

permissions:
  contents: write

concurrency:
  group: playlist-write        # shared: both workflows write to main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Refresh the iCN source into its own copy, then merge it with the
      # tivora playlist and the curated iptv-org lists, de-duplicate, probe
      # every channel, drop the dead ones and rebuild tidy category files.
      - name: Refresh iCN source
        run: python3 icn_runner.py --check --workers 48 --retries 2

      - name: Refresh tivora source
        run: python3 tivora_build.py --workers 48 --retries 2

      - name: Merge all sources into the published playlists
        run: python3 merge_build.py --publish

      # MAXstream: stream-nya butuh akun + IP Indonesia (API 403 dari luar),
      # jadi yang dibuat adalah daftar resmi 117 channel MAXstream yang
      # dipetakan ke stream kita yang sudah terbukti jalan.
      - name: Build MAXstream playlist
        run: python3 maxstream_build.py --publish

      - name: Health summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          if not os.path.exists("health.json"):
              print("health.json tidak ada (runner gagal sebelum probe)")
              raise SystemExit(0)
          d = json.load(open("health.json"))
          print(f"total : {d['total']}")
          print(f"kept  : {d['kept']}")
          for k, v in sorted(d.get("counts", {}).items(), key=lambda x: -x[1]):
              print(f"  {k:7} {v}")
          print("\ngrup terbesar:")
          for name, s in sorted(d.get("groups", {}).items(),
                                key=lambda kv: -kv[1]["total"])[:10]:
              print(f"  {name[:38]:40} {s['live']:4}/{s['total']:<4} live")
          PY

      - name: Commit playlists + manifest + health
        run: |
          git config user.name  "gh-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ICNPLAY.m3u       = health-checked playlist used by players
          # ICNPLAY_full.m3u  = unfiltered fallback (every channel)
          # ICNPLAY_fast.m3u  = only fast/live channels (<=3s), HLS first
          # kids.m3u          = channel anak saja, HLS dulu lalu DASH
          git add playlist/ manifest.json health.json ICNPLAY.m3u \
                  ICNPLAY_full.m3u ICNPLAY_fast.m3u kids.m3u \
                  DRM_Clearkey.m3u PREMIUM.m3u MAXSTREAM.m3u \
                  categories/ icn/ tivora/ maxstream/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "auto: refresh + health $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do
              if git push; then echo "pushed"; break; fi
              echo "push ditolak (remote maju), rebase lalu coba lagi ($i)"
              git pull --rebase --autostash origin main || true
            done
          fi

      - name: Verify published playlist (API, not CDN cache)
        run: |
          for i in 1 2 3 4 5; do
            sleep 6
            code=$(curl -sS -m 30 -H "Accept: application/vnd.github.raw" \
              -o /tmp/icn.m3u -w "%{http_code}" \
              "https://api.github.com/repos/${{ github.repository }}/contents/ICNPLAY.m3u?ref=main")
            ext=$(grep -c '#EXTINF' /tmp/icn.m3u 2>/dev/null || echo 0)
            url=$(grep -c '^http' /tmp/icn.m3u 2>/dev/null || echo 0)
            echo "percobaan $i: HTTP $code | EXTINF=$ext | urls=$url"
            if [ "$code" = "200" ] && [ "$ext" -gt 0 ] && [ "$ext" = "$url" ]; then
              echo "OK: playlist valid (EXTINF == URL)"
              exit 0
            fi
          done
          echo "GAGAL: playlist tidak valid setelah 5 percobaan"
          exit 1
