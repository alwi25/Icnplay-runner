name: refresh-playlists

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"          # daily at 04:15 UTC
    - cron: "0 10 * * 1,4"        # extra: Tue & Fri midday

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run runner (skip stream probe in CI)
        run: python3 icn_runner.py --no-probe
      - name: Commit updated playlists + manifest
        run: |
          git config user.name  "gh-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist/ manifest.json
          if git diff --cached --quiet; then
            echo "No changes, nothing to commit."
          else
            git commit -m "auto: refresh playlists $(date -u +%Y-%m-%d)"
            git push
          fi
